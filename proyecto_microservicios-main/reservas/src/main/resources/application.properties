spring.application.name=reservas
spring.datasource.url=jdbc:mysql://localhost:3306/reservasproyecto?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:abc123}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
server.port=8701
springdoc.api-docs.path=/api-reservas

usuarios.service.url=${USUARIOS_SERVICE_URL:http://localhost:8702}
reservas.service.url=${RESERVAS_SERVICE_URL:http://localhost:8701}

eureka.client.serviceUrl.defaultZone=http://localhost:8700/eureka/